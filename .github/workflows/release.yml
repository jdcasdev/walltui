name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: build
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "walltui-linux-${arch}" ./cmd/walltui
            tar czf "walltui-linux-${arch}.tar.gz" "walltui-linux-${arch}"
          done

      - name: publish
        run: gh release create "${GITHUB_REF_NAME}" walltui-linux-*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
